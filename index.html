<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울파 변지팀 여름 워크숍 — 함께, 묻다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F4EDE1;
    --ink-dim:#B9C4C1;
    --bg-0:#152321;
    --bg-1:#1C302D;
    --line: rgba(244,237,225,0.14);

    --c-daily: #E8A548;
    --c-emotion:#E4707A;
    --c-work: #6FA98C;
    --accent: var(--c-daily);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(232,165,72,0.10), transparent 60%),
      radial-gradient(1000px 500px at 100% 10%, rgba(228,112,122,0.10), transparent 55%),
      radial-gradient(900px 700px at 50% 120%, rgba(111,169,140,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 44px 0 70px;
    overflow-x:hidden;
  }

  .brandmark{
    font-family:'Gaegu', sans-serif;
    font-size: 13px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 12px;
    padding: 0 20px;
    text-align:center;
  }
  h1{
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size: clamp(30px, 6.5vw, 52px);
    margin: 0 0 8px;
    line-height: 1.15;
    text-align:center;
    padding: 0 20px;
    background: linear-gradient(95deg, var(--c-daily) 10%, var(--c-emotion) 50%, var(--c-work) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub{
    text-align:center;
    color: var(--ink-dim);
    font-size: 14.5px;
    max-width: 480px;
    line-height:1.7;
    margin-bottom: 34px;
    padding: 0 20px;
  }

  .tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom: 8px;
    padding: 0 20px;
  }
  .tab{
    appearance:none;
    border:1px solid var(--line);
    background: rgba(255,255,255,0.03);
    color: var(--ink);
    font-family:'Noto Sans KR';
    font-weight:500;
    font-size: 14px;
    padding: 11px 22px;
    border-radius: 999px;
    cursor:pointer;
    transition: all .25s ease;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tab .dot{ width:8px; height:8px; border-radius:50%; background: var(--ink-dim); transition: background .25s; }
  .tab:hover{ border-color: rgba(244,237,225,0.3); }
  .tab.active{ color: #14201E; font-weight:700; border-color:transparent; }
  .tab.active .dot{ background:#14201E; }
  .tab[data-cat="일상"].active{ background:var(--c-daily); }
  .tab[data-cat="감정"].active{ background:var(--c-emotion); }
  .tab[data-cat="업무"].active{ background:var(--c-work); }

  .count{ color: var(--ink-dim); font-size: 13px; margin: 18px 0 26px; letter-spacing:.02em; text-align:center; padding:0 20px;}
  .count b{ color: var(--ink); font-weight:700; }

  .marquee-wrap{
    width:100%;
    max-width: 1100px;
    overflow:hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
    padding: 10px 0;
  }
  .marquee-track{
    display:flex;
    width: max-content;
    gap: 18px;
    animation: scroll linear infinite;
  }
  .marquee-track.paused{ animation-play-state: paused; }
  .marquee-wrap:hover .marquee-track:not(.paused){ animation-play-state: paused; }

  @keyframes scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  .rcard{
    perspective: 1200px;
    width: 148px;
    height: 208px;
    flex: 0 0 auto;
    cursor:pointer;
  }
  .rcard.used{ cursor: default; }
  .rcard-inner{
    position:relative;
    width:100%; height:100%;
    border-radius: 16px;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(255,255,255,0.18), transparent 55%),
      linear-gradient(155deg, var(--cat-a), var(--cat-b));
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 10px 22px rgba(0,0,0,0.32);
    display:flex; align-items:center; justify-content:center;
    transition: transform .25s ease, opacity .3s ease, filter .3s ease;
  }
  .rcard:not(.used):hover .rcard-inner{ transform: translateY(-5px) scale(1.03); }
  .rcard.used .rcard-inner{ opacity: 0.28; filter: grayscale(0.5); }
  .rcard .glyph{
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size: 54px;
    color: rgba(21,35,33,0.28);
  }
  .rcard .cat-tag{
    position:absolute; top:12px; left:13px;
    font-size:10px; font-weight:700; letter-spacing:.06em;
    color: rgba(21,35,33,0.6);
  }
  .rcard .check{
    position:absolute; top:10px; right:11px;
    font-size:14px; opacity:0;
    color: rgba(21,35,33,0.75);
  }
  .rcard.used .check{ opacity:1; }
  .rcard .brand{
    position:absolute; bottom:12px;
    font-size: 9px; font-weight:700; letter-spacing: .28em;
    color: rgba(21,35,33,0.55);
  }

  .hint{
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-dim);
    text-align:center;
    padding: 0 20px;
  }

  .controls{
    display:flex;
    gap: 12px;
    margin-top: 22px;
  }
  .btn{
    appearance:none;
    border:none;
    border-radius: 999px;
    padding: 12px 24px;
    font-family:'Noto Sans KR';
    font-weight:700;
    font-size: 13.5px;
    cursor:pointer;
    transition: transform .15s ease;
  }
  .btn:active{ transform: scale(0.96); }
  .btn.ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .btn.ghost:hover{ border-color: rgba(244,237,225,0.4); }

  .overlay{
    position:fixed; inset:0;
    background: rgba(10,16,15,0.72);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .3s ease;
    z-index: 50;
    padding: 20px;
  }
  .overlay.show{ opacity:1; pointer-events:all; }

  .modal-card{
    width: min(420px, 100%);
    background:#FBF6EC;
    color:#1D2321;
    border-radius: 22px;
    padding: 34px 30px 28px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    transform: scale(0.85) rotateX(12deg);
    opacity:0;
    transition: transform .45s cubic-bezier(.2,.9,.25,1), opacity .35s ease;
  }
  .overlay.show .modal-card{ transform: scale(1) rotateX(0); opacity:1; }

  .modal-card .tag{
    display:inline-block;
    font-size: 11px;
    font-weight:700;
    letter-spacing:.1em;
    padding: 5px 12px;
    border-radius: 999px;
    color:#fff;
    margin-bottom: 18px;
  }
  .modal-card .q{
    font-family:'Gowun Dodum', sans-serif;
    font-size: 21px;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .modal-card .rule{ width:30px; height:2px; background: rgba(0,0,0,0.18); margin-bottom: 12px; }
  .modal-card .subq{
    font-size: 14px;
    line-height: 1.6;
    color: #5B5147;
    margin-bottom: 26px;
  }
  .modal-card .modal-btn{
    width:100%;
    padding: 14px;
    border-radius: 14px;
    border:none;
    font-weight:700;
    font-size: 14px;
    cursor:pointer;
    background: #1D2321;
    color: #FBF6EC;
    transition: opacity .2s;
  }
  .modal-card .modal-btn:hover{ opacity: 0.85; }

  footer{
    margin-top: 40px;
    color: var(--ink-dim);
    font-size: 11.5px;
    text-align:center;
    opacity:0.65;
    padding: 0 20px;
  }

  @media (max-width: 480px){
    .rcard{ width: 122px; height: 174px; }
    .rcard .glyph{ font-size: 44px; }
  }
</style>
</head>
<body>

  <div class="brandmark">TOGETHER WE ASK</div>
  <h1>서울파 변지팀 여름 워크숍<br>함께, 묻다</h1>
  <p class="sub">카드가 계속 흘러가고 있어요. 마음에 드는 카드를 톡, 터치해보세요.</p>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="일상"><span class="dot"></span>일상</button>
    <button class="tab" data-cat="감정"><span class="dot"></span>감정</button>
    <button class="tab" data-cat="업무"><span class="dot"></span>업무</button>
  </div>

  <div class="count" id="count"></div>

  <div class="marquee-wrap">
    <div class="marquee-track" id="track"></div>
  </div>

  <p class="hint">카드를 누르면 멈추고 질문이 열려요 · 이미 뽑은 카드는 흐려져요</p>

  <div class="controls">
    <button class="btn ghost" id="resetAll">이 카테고리 카드 초기화</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal-card" id="modalCard">
      <span class="tag" id="modalTag"></span>
      <div class="q" id="modalQ"></div>
      <div class="rule"></div>
      <div class="subq" id="modalSub"></div>
      <button class="modal-btn" id="modalClose">닫고 계속 돌리기</button>
    </div>
  </div>

  <footer>일상 15 · 감정 13 · 업무 11 · 총 39장</footer>

<script>
const QUESTIONS = [
{id:1,type:'일상',q:'요즘 하루 중 가장 좋아하는 시간대는 언제인가요?',sub:'그 시간에 주로 무엇을 하나요?'},
{id:2,type:'일상',q:'올해 새롭게 시작한 습관이 있나요?',sub:'그 습관을 시작하게 된 계기는 무엇인가요?'},
{id:3,type:'일상',q:'요즘 자주 듣는 노래나 플레이리스트가 있나요?',sub:'그 음악을 들으면 어떤 기분이 드나요?'},
{id:4,type:'일상',q:'최근 일주일 중 가장 기억에 남는 순간은?',sub:'왜 그 순간이 유독 기억에 남았을까요?'},
{id:5,type:'일상',q:'요즘 스스로에게 주는 작은 보상이 있나요?',sub:'그 보상을 정한 이유는 무엇인가요?'},
{id:6,type:'일상',q:'최근에 미뤄왔던 일 중 드디어 해낸 것이 있나요?',sub:'해내고 난 뒤 기분이 어땠나요?'},
{id:7,type:'일상',q:'올해 산 물건 중 가장 만족스러운 것은 무엇인가요?',sub:'그 물건이 일상에 어떤 변화를 주었나요?'},
{id:8,type:'일상',q:'올해 본 콘텐츠 중 주변에 추천하고 싶은 게 있나요?',sub:'어떤 점이 가장 좋았나요?'},
{id:9,type:'일상',q:'오늘 아침, 눈을 뜨자마자 가장 먼저 떠오른 생각은 무엇이었나요?',sub:'그 생각이 하루에 어떤 영향을 주었나요?'},
{id:10,type:'일상',q:'지난 일주일 동안 일어난 일 중 한 가지를 바꿀 수 있다면?',sub:'반면 바뀌지 않았으면 하는 날이 있나요?'},
{id:11,type:'일상',q:'혼자 생각 정리를 하고 싶을 때 찾는 장소가 있나요?',sub:'그 장소가 도움이 되는 이유는 무엇인가요?'},
{id:12,type:'일상',q:"나의 '부캐'를 만든다면 (혹시 이미 있다면) 어떤 캐릭터를 만들고 싶나요?",sub:'왜 이런 부캐를 만들고 싶나요?'},
{id:13,type:'일상',q:"최근에 느낀 '소확행'은 무엇인가요?",sub:'언제 그 행복을 느끼나요?'},
{id:14,type:'일상',q:'오늘 아침 옷을 고를 때 어떤 기준으로 골랐나요?',sub:'평소에도 그 기준을 따르는 편인가요?'},
{id:15,type:'일상',q:"요즘 나의 '추구미'인 인물이나 캐릭터가 있나요?",sub:'추구미 : 자신이 되고 싶은 모습, 지향하는 분위기나 스타일을 표현하는 신조어예요.'},
{id:16,type:'감정',q:'요즘 가장 자주 느끼는 감정은 무엇인가요?',sub:'그 감정이 찾아올 때 주로 어떻게 반응하나요?'},
{id:17,type:'감정',q:"요즘 나를 '킹받게' 하는 사소한 것이 있나요?",sub:'(너무 무거운 건 말고 가벼운 거로!) 왜 그게 신경 쓰이나요?'},
{id:18,type:'감정',q:'화가 났을 때 스스로를 가라앉히는 나만의 방법이 있나요?',sub:'그 방법을 알게 된 계기는 무엇인가요?'},
{id:19,type:'감정',q:'최근 럭키비키했던 순간이 있었나요?',sub:'어떤 일이었나요?'},
{id:20,type:'감정',q:'요즘 가장 든든하게 느껴지는 사람이나 존재는 누구인가요?',sub:'그 존재가 왜 든든하게 느껴지나요?'},
{id:21,type:'감정',q:'요즘 스스로에게 가장 자주 하는 말은 무엇인가요?',sub:'그 말이 힘이 되나요, 아니면 부담이 되나요?'},
{id:22,type:'감정',q:'마음이 편안해지는 나만의 순간이나 루틴이 있나요?',sub:'언제부터 그렇게 느끼기 시작했나요?'},
{id:23,type:'감정',q:'요즘 나의 감정을 색으로 표현한다면 무슨 색에 가까운가요?',sub:'그 색을 고른 이유는 무엇인가요?'},
{id:24,type:'감정',q:'최근에 웃참(웃음 참기) 실패했던 순간이 있나요?',sub:'어떤 상황이었나요?'},
{id:25,type:'감정',q:'긴장될 때 나도 모르게 하는 행동이나 습관이 있나요?',sub:'언제부터 그랬는지 기억나나요?'},
{id:26,type:'감정',q:"최근 한 달 중 '오늘 하루 진짜 잘 살았다' 싶었던 날이 있나요?",sub:'무엇이 그렇게 느끼게 했나요?'},
{id:27,type:'감정',q:'기분이 안 좋을 때도 당신을 웃게 만드는 것은 무엇인가요?',sub:'그것을 처음 깨닫게 된 때는 언제인가요?'},
{id:28,type:'감정',q:'당신은 어떤 방식으로 다른 사람을 위로하나요?',sub:'반대로 내가 위로받고 싶을 때는 어떤 방식이 편한가요?'},
{id:29,type:'업무',q:'업무를 하면서 나만의 작은 성취감을 느끼는 순간이 있나요?',sub:'그런 순간을 더 자주 만들려면 어떻게 하면 좋을까요?'},
{id:30,type:'업무',q:'팀원 중 이런 점은 배우고 싶다 싶은 부분이 있나요?',sub:'어떤 순간에 그렇게 느꼈나요?'},
{id:31,type:'업무',q:'최근에 새로 알게 된 업무 노하우나 팁이 있나요?',sub:'어떻게 발견하게 되었나요?'},
{id:32,type:'업무',q:'일하면서 에너지를 얻는 나만의 방법이 있나요?',sub:'그 방법을 공유한다면 무엇을 나누고 싶나요?'},
{id:33,type:'업무',q:"업무 중 나만의 '집중 스위치'를 켜는 방법이 있나요?",sub:'언제 그 방법을 발견했나요?'},
{id:34,type:'업무',q:'우리 팀 하면 떠오르는 색깔이 있다면?',sub:'그렇게 떠올린 이유는 무엇인가요?'},
{id:35,type:'업무',q:'우리 팀 하면 떠오르는 동물이 있다면?',sub:'그렇게 떠올린 이유는 무엇인가요?'},
{id:36,type:'업무',q:'월요일 아침과 금요일 오후, 나의 텐션은 각각 몇 점인가요?',sub:'그 차이는 보통 무엇 때문인가요?'},
{id:37,type:'업무',q:'업무 책상이나 출근 가방에 꼭 두는 물건이 있나요?',sub:'그게 왜 거기 있게 되었나요?'},
{id:38,type:'업무',q:'최근 업무 중 나만의 작은 규칙이나 루틴을 만든 게 있나요?',sub:'왜 그런 규칙을 만들게 되었나요?'},
{id:39,type:'업무',q:"팀에서 나의 '만렙' 스킬은 무엇이라고 생각하나요?",sub:'어떻게 그 스킬을 키우게 됐나요?'},
];

const CAT_COLORS = {
  '일상': {a:'#F0BB6E', b:'#D68F2E', tag:'#B87A2B', glyph:'일'},
  '감정': {a:'#EE939B', b:'#D3606C', tag:'#B14A55', glyph:'감'},
  '업무': {a:'#8FC1A6', b:'#5C9A7C', tag:'#457A62', glyph:'업'},
};

const SECONDS_PER_CARD = 3.2;

let currentCat = '일상';
let usedByCat = { '일상': new Set(), '감정': new Set(), '업무': new Set() };

const trackEl = document.getElementById('track');
const countEl = document.getElementById('count');
const overlayEl = document.getElementById('overlay');
const modalTag = document.getElementById('modalTag');
const modalQ = document.getElementById('modalQ');
const modalSub = document.getElementById('modalSub');

function pool(cat){ return QUESTIONS.filter(q => q.type === cat); }

function buildCard(item){
  const colors = CAT_COLORS[item.type];
  const used = usedByCat[item.type].has(item.id);
  const el = document.createElement('div');
  el.className = 'rcard' + (used ? ' used' : '');
  el.dataset.id = item.id;
  el.innerHTML = `
    <div class="rcard-inner" style="--cat-a:${colors.a}; --cat-b:${colors.b}">
      <span class="cat-tag">${item.type}</span>
      <span class="check">✓</span>
      <span class="glyph">${colors.glyph}</span>
      <span class="brand">함께,묻다</span>
    </div>
  `;
  el.addEventListener('click', () => onPick(item));
  return el;
}

function render(){
  const items = pool(currentCat);
  trackEl.innerHTML = '';
  [...items, ...items].forEach(item => trackEl.appendChild(buildCard(item)));

  const duration = items.length * SECONDS_PER_CARD;
  trackEl.style.animationDuration = duration + 's';
  trackEl.classList.remove('paused');

  const usedCount = usedByCat[currentCat].size;
  countEl.innerHTML = `<b>${currentCat}</b> 카테고리 · 총 <b>${items.length}</b>장 중 <b>${usedCount}</b>장 뽑음`;
}

function onPick(item){
  if(usedByCat[item.type].has(item.id)) return;
  trackEl.classList.add('paused');
  usedByCat[item.type].add(item.id);

  document.querySelectorAll(`.rcard[data-id="${item.id}"]`).forEach(c => c.classList.add('used'));

  const colors = CAT_COLORS[item.type];
  modalTag.textContent = item.type;
  modalTag.style.background = colors.tag;
  modalQ.textContent = item.q;
  modalSub.textContent = item.sub;
  overlayEl.classList.add('show');

  const usedCount = usedByCat[currentCat].size;
  const total = pool(currentCat).length;
  countEl.innerHTML = `<b>${currentCat}</b> 카테고리 · 총 <b>${total}</b>장 중 <b>${usedCount}</b>장 뽑음`;
}

document.getElementById('modalClose').addEventListener('click', () => {
  overlayEl.classList.remove('show');
  trackEl.classList.remove('paused');
});

overlayEl.addEventListener('click', (e) => {
  if(e.target === overlayEl){
    overlayEl.classList.remove('show');
    trackEl.classList.remove('paused');
  }
});

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  render();
});

document.getElementById('resetAll').addEventListener('click', () => {
  usedByCat[currentCat].clear();
  render();
});

render();
</script>
</body>
</html>
